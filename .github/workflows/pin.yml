---
# Pins the formulas and cask to the latest stable Erebine/binaries
# release (or the tag given at dispatch) and commits the result to main.
#
# The pin is checked before it is committed. scripts/update-formulas.sh
# fails when a rewrite does not take, and scripts/check-license.sh fails
# when a version disagrees with the tag its url downloads from, so a run
# that would leave a formula naming one build while installing another
# stops here instead of landing on main and failing the License workflow
# after the fact.
name: Pin formulas to release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Erebine/binaries release tag to pin (default latest stable)
        required: false
        type: string

jobs:
  pin:
    name: Pin and commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Pin formulas and cask
        id: pin
        run: make update TAG="${{ inputs.tag }}"
        env:
          # Authenticated requests are not subject to the per-IP rate limit
          # that unauthenticated calls from shared runners can hit.
          GH_TOKEN: ${{ github.token }}

      - name: Every version agrees with the tag its url downloads from
        run: bash scripts/check-license.sh

      - name: Commit and push
        env:
          TAG: ${{ steps.pin.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula Casks
          if git diff --cached --quiet; then
            echo "formulas and cask already pinned to ${TAG}; nothing to commit"
          else
            git commit -m "pin formulas and cask to ${TAG#v}"
            git push
          fi
